<!DOCTYPE html>
<html lang="it" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Text Generator</title>
  <meta name="description" content="A lightweight browser-based Lorem Ipsum generator" />
  <meta property="og:title" content="Dummy Text" />
  <meta property="og:description" content="A lightweight browser-based Lorem Ipsum generator" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f7f7f4" />
  <script>
    /* Apply saved (or system) language and theme before first paint, so there is no flash */
    (function () {
      var lang, theme;
      try {
        lang = localStorage.getItem('dummy-text-language');
        theme = localStorage.getItem('dummy-text-theme');
      } catch (_) {}
      if (lang !== 'it' && lang !== 'en') {
        lang = (navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en';
      }
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.lang = lang;
      root.dataset.theme = theme;
      if (theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').content = '#181a1f';
      }
    })();
  </script>
  <link rel="stylesheet" type="text/css" href="assets/css/tailwind.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet"/>
  <script defer src="assets/js/alpine.min.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />
</head>

<body x-data="dummyTextApp()" x-cloak>
  <div class="app-container">
    <header class="app-header">
      <div class="header-row">
        <span class="app-title" x-text="t.title"></span>
        <div class="global-preferences">
          <button type="button" class="pref-btn pref-btn-lang" @click="toggleLang()"
            :title="lang === 'it' ? t.switchToEnglish : t.switchToItalian"
            :aria-label="lang === 'it' ? t.switchToEnglish : t.switchToItalian"
            x-text="lang === 'it' ? 'EN' : 'IT'"></button>
          <button type="button" class="pref-btn" @click="toggleTheme()"
            :title="theme === 'dark' ? t.activateLightTheme : t.activateDarkTheme"
            :aria-label="theme === 'dark' ? t.activateLightTheme : t.activateDarkTheme">
            <svg x-show="theme === 'light'" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg x-show="theme === 'dark'" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main class="card generator-card">
      <section>
        <label class="label control-label" x-text="t.mode"></label>
        <div class="mode-grid">
          <template x-for="mode in modes" :key="mode.value">
            <button @click="selectedMode = mode.value"
              :class="selectedMode === mode.value ? 'active' : ''"
              class="mode-btn"
              x-text="t[mode.labelKey]">
            </button>
          </template>
        </div>
      </section>
      <section>
        <div class="quantity-heading">
          <label class="label" x-text="t.quantity"></label>
          <span class="mode-unit" x-text="currentModeUnit"></span>
        </div>
        <div class="quantity-controls">
          <button @click="quantity = Math.max(1, quantity - stepAmount)" type="button"
            class="btn-secondary step-button" :aria-label="t.decreaseQuantity">-
          </button>
          <input type="number" x-model.number="quantity" min="1" :max="currentMax"
            class="field quantity-field" />
          <button @click="quantity = Math.min(currentMax, quantity + stepAmount)" type="button"
            class="btn-secondary step-button" :aria-label="t.increaseQuantity">+
          </button>
        </div>
        <div class="preset-row">
          <template x-for="preset in currentPresets" :key="preset">
            <button @click="quantity = preset"
              :class="quantity === preset ? 'active' : ''"
              class="preset-btn"
              x-text="preset">
            </button>
          </template>
        </div>
      </section>
      <button @click="generate()" class="btn-primary generate-button">
        <span x-text="t.generateText"></span>
      </button>
      <section x-show="generatedText" x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0">
        <div class="output-heading">
          <label class="label" x-text="t.output"></label>
          <span class="output-stats" x-text="statsLabel"></span>
        </div>
        <textarea :value="generatedText" readonly rows="7" class="field output-area"></textarea>
        <button @click="copyText()"
          class="btn-secondary copy-button">
          <svg xmlns="http://www.w3.org/2000/svg" class="copy-icon" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span x-text="isCopied ? t.textCopied : t.copyText"></span>
        </button>
      </section>
    </main>
    <footer class="app-footer">
      <span class="text-xs text-subtle" x-text="t.madeWith"></span>
    </footer>
  </div>
  <script src="assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/dummy-text/sw.js');
    }

    window.addEventListener('load', () => {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
      if (isStandalone) {
        window.resizeTo(750, 650);
      }
    });
  </script>
</body>

</html>
